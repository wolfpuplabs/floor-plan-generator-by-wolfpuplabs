<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Architecture Generator - Orthogonal Sweep</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #111; color: #eee; overflow: hidden; font-size: 14px; }
        #app { display: flex; width: 100vw; height: 100vh; }
        
        #sidebar { width: 340px; background: #1a1a1a; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #333; z-index: 10; }
        h1 { font-size: 1.1rem; color: #00d2ff; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 5px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.8rem; color: #aaa; }
        input[type="file"], select, input[type="range"] { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 4px; }
        input[type="range"] { accent-color: #00d2ff; }
        .val-disp { font-size: 0.75rem; color: #00d2ff; text-align: right; }
        
        button { background: #007acc; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; text-transform: uppercase; }
        button:hover { background: #0098ff; }
        
        #preview { width: 100%; height: 160px; background: #000; border: 1px dashed #555; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        #canvas2d { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        #viewport { flex: 1; position: relative; background: #050505; }
        #loader { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; color: #00d2ff; font-weight: bold; z-index: 20; flex-direction: column; gap: 10px; }
        .spinner { width: 30px; height: 30px; border: 3px solid #333; border-top: 3px solid #00d2ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="app">
    <div id="sidebar">
        <h1>Arsitektur 3D Gen</h1>
        
        <div class="form-group">
            <label>1. Upload Denah Bersih (Hitam Putih)</label>
            <input type="file" id="upload" accept="image/*">
        </div>
        <div id="preview"><canvas id="canvas2d"></canvas></div>

        <div class="form-group">
            <label>Tinggi Floor-to-Floor (m)</label>
            <input type="range" id="height" min="2.8" max="4.5" step="0.1" value="3.2">
            <span class="val-disp" id="h-val">3.2 m (Standar)</span>
        </div>
        
        <div class="form-group">
            <label>Threshold Dinding (Hitam)</label>
            <input type="range" id="thresh" min="20" max="200" step="1" value="120">
            <span class="val-disp" id="t-val">120</span>
        </div>

        <button id="generate">Proses Geometri Dinding</button>
    </div>

    <div id="viewport">
        <div id="loader">
            <div class="spinner"></div>
            <span>Membangun Struktur Arsitektur...</span>
        </div>
    </div>
</div>

<script>
// --- Three.js Setup ---
const container = document.getElementById('viewport');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(20, 25, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(30, 50, 20);
dirLight.castShadow = true;
dirLight.shadow.camera.left = -30;
dirLight.shadow.camera.right = 30;
dirLight.shadow.camera.top = 30;
dirLight.shadow.camera.bottom = -30;
scene.add(dirLight);

scene.add(new THREE.GridHelper(50, 50, 0x444444, 0x222222));

const buildingGroup = new THREE.Group();
scene.add(buildingGroup);

window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

// --- 2D Canvas & Image Processing ---
const canvas = document.getElementById('canvas2d');
const ctx = canvas.getContext('2d');

document.getElementById('upload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
            // Resolusi menengah agar detail dinding dapat dibaca tanpa memberatkan browser
            const MAX = 250; 
            let w = img.width, h = img.height;
            if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
            else { w = Math.round(w * MAX / h); h = MAX; }
            canvas.width = w; canvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
});

// UI Updates
document.getElementById('height').addEventListener('input', e => document.getElementById('h-val').innerText = e.target.value + ' m');
document.getElementById('thresh').addEventListener('input', e => document.getElementById('t-val').innerText = e.target.value);

// --- Architectural Generation Logic ---
document.getElementById('generate').addEventListener('click', () => {
    if(canvas.width === 0) return alert("Upload denah!");
    
    document.getElementById('loader').style.display = 'flex';
    
    setTimeout(() => {
        while(buildingGroup.children.length > 0) {
            buildingGroup.remove(buildingGroup.children[0]);
        }

        const wallH = parseFloat(document.getElementById('height').value);
        const thresh = parseInt(document.getElementById('thresh').value);
        
        // Konstanta Kaidah Arsitektur
        const PIXEL_SCALE = 0.1; // 1 pixel = 10 cm
        const WALL_THICKNESS = 0.15; // Tebal dinding standar 15 cm
        const MIN_WALL_LEN = 3; // Abaikan garis yang lebih pendek dari 3 piksel (noise/teks)

        const w = canvas.width;
        const h = canvas.height;
        const imgData = ctx.getImageData(0, 0, w, h).data;
        
        // Peta Biner Hitam Putih
        const bwMap = Array.from({length: h}, () => new Array(w).fill(false));
        for(let y=0; y<h; y++){
            for(let x=0; x<w; x++){
                const i = (y * w + x) * 4;
                const brightness = (imgData[i] + imgData[i+1] + imgData[i+2]) / 3;
                if(brightness < thresh) bwMap[y][x] = true;
            }
        }

        const visited = Array.from({length: h}, () => new Array(w).fill(false));
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.7 });

        const offsetX = (w * PIXEL_SCALE) / 2;
        const offsetZ = (h * PIXEL_SCALE) / 2;

        const addWall = (posX, posZ, lengthX, lengthZ) => {
            const geo = new THREE.BoxGeometry(lengthX, wallH, lengthZ);
            const mesh = new THREE.Mesh(geo, wallMat);
            // Penyesuaian pivot dari pojok ke tengah
            mesh.position.set(
                (posX * PIXEL_SCALE) + (lengthX / 2) - offsetX,
                wallH / 2,
                (posZ * PIXEL_SCALE) + (lengthZ / 2) - offsetZ
            );
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            buildingGroup.add(mesh);
        };

        // PASS 1: Horizontal Sweep (Sumbu X)
        for(let y=0; y<h; y++) {
            let x = 0;
            while(x < w) {
                if(bwMap[y][x]) {
                    let len = 0;
                    while(x + len < w && bwMap[y][x + len]) len++;
                    
                    if(len >= MIN_WALL_LEN) { // Syarat panjang dinding minimum
                        for(let i=0; i<len; i++) visited[y][x+i] = true;
                        // Render dengan ketebalan arsitektur 0.15m (bukan berdasarkan piksel)
                        addWall(x, y, len * PIXEL_SCALE, WALL_THICKNESS);
                    }
                    x += len;
                } else {
                    x++;
                }
            }
        }

        // PASS 2: Vertical Sweep (Sumbu Z)
        for(let x=0; x<w; x++) {
            let y = 0;
            while(y < h) {
                // Hanya periksa piksel yang belum dijadikan dinding horizontal
                if(bwMap[y][x] && !visited[y][x]) {
                    let len = 0;
                    while(y + len < h && bwMap[y + len][x] && !visited[y + len][x]) len++;
                    
                    if(len >= MIN_WALL_LEN) {
                        for(let i=0; i<len; i++) visited[y+i][x] = true;
                        // Render dinding vertikal
                        addWall(x, y, WALL_THICKNESS, len * PIXEL_SCALE);
                    }
                    y += len;
                } else {
                    y++;
                }
            }
        }

        // Slab Lantai
        const floor = new THREE.Mesh(
            new THREE.BoxGeometry(w * PIXEL_SCALE + 1, 0.2, h * PIXEL_SCALE + 1),
            new THREE.MeshStandardMaterial({ color: 0xcccccc })
        );
        floor.position.set(0, -0.1, 0);
        floor.receiveShadow = true;
        buildingGroup.add(floor);

        document.getElementById('loader').style.display = 'none';
        controls.target.set(0, wallH/2, 0);
    }, 100);
});
</script>
</body>
</html>

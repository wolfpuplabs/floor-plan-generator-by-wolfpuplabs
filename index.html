<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Floor Plan - Responsive UI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #121214; color: #fff; overflow: hidden; font-size: 13px; }
        
        #app { display: flex; width: 100vw; height: 100vh; flex-direction: row; }
        
        #sidebar { 
            width: 340px; 
            background: #1a1a1d; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            border-right: 1px solid #333; 
            z-index: 10; 
            box-shadow: 2px 0 15px rgba(0,0,0,0.7); 
            overflow-y: auto; 
        }
        
        h1 { font-size: 1rem; color: #4ec9b0; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 0; letter-spacing: 0.5px; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.8rem; color: #ccc; }
        input[type="file"], input[type="range"] { background: #252529; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 4px; outline: none; }
        input[type="range"] { accent-color: #4ec9b0; cursor: pointer; width: 100%; }
        .val-disp { font-size: 0.75rem; color: #4ec9b0; text-align: right; font-weight: bold; }
        
        button { background: #0e639c; color: white; border: none; padding: 14px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; margin-top: 5px; letter-spacing: 1px; }
        button:hover { background: #1177bb; }
        
        #preview-box { width: 100%; height: 160px; background: #fff; border: 2px dashed #555; display: flex; align-items: center; justify-content: center; border-radius: 6px; overflow: hidden; }
        #canvas2d { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        #viewport { flex: 1; position: relative; background: #080808; }
        
        #loader { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; color: #4ec9b0; font-weight: bold; z-index: 20; flex-direction: column; gap: 15px; font-size: 1.1rem; text-align: center; padding: 20px;}
        .spinner { width: 40px; height: 40px; border: 4px solid #222; border-top: 4px solid #4ec9b0; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ======== MEDIA QUERIES UNTUK RESPONSIVE (MOBILE & TABLET) ======== */
        @media (max-width: 768px) {
            #app { 
                flex-direction: column; /* Ubah ke layout atas-bawah */
            }
            #viewport { 
                width: 100%; 
                height: 55vh; /* Viewport 3D di atas mengambil 55% layar */
                flex: none; 
                order: 1; /* Paksa posisi di atas */
            }
            #sidebar { 
                width: 100%; 
                flex: 1; /* Sidebar mengambil sisa layar di bawah */
                border-right: none; 
                border-top: 2px solid #333; 
                box-shadow: 0 -4px 20px rgba(0,0,0,0.7);
                order: 2; /* Paksa posisi di bawah */
                padding: 15px;
            }
            #preview-box {
                height: 120px; /* Preview gambar sedikit lebih kecil di HP */
            }
            button {
                padding: 16px; /* Tombol lebih tebal agar mudah ditekan jari */
                margin-bottom: 20px; /* Jarak aman untuk scrolling di HP */
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="app">
    <div id="sidebar">
        <h1>Generator Dinding & Bukaan</h1>
        
        <div class="form-group">
            <label>1. Upload Denah 2D</label>
            <input type="file" id="upload" accept="image/*">
        </div>
        <div id="preview-box"><canvas id="canvas2d"></canvas></div>

        <div class="form-group">
            <label>Tinggi Floor-to-Floor (m)</label>
            <input type="range" id="wallH" min="2.8" max="4.5" step="0.1" value="3.2">
            <span class="val-disp" id="wallH-val">3.2 m</span>
        </div>

        <div class="form-group">
            <label>Ketebalan Minimum Dinding</label>
            <input type="range" id="minThick" min="1" max="5" step="1" value="2">
            <span class="val-disp" id="minThick-val">2 px</span>
        </div>

        <div class="form-group">
            <label>Panjang Minimum Dinding</label>
            <input type="range" id="minLen" min="1" max="40" step="1" value="6">
            <span class="val-disp" id="minLen-val">6 px</span>
        </div>
        
        <div class="form-group">
            <label>Sensitivitas Garis Hitam</label>
            <input type="range" id="thresh" min="50" max="250" step="1" value="187">
            <span class="val-disp" id="thresh-val">187</span>
        </div>

        <button id="generateBtn">Buat Maket Arsitektur 3D</button>
    </div>

    <div id="viewport">
        <div id="loader">
            <div class="spinner"></div>
            <span>Mengekstrak Dinding, Pintu, & Jendela...</span>
        </div>
    </div>
</div>

<script>
const container = document.getElementById('viewport');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151518);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(20, 30, 40);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
dirLight.position.set(30, 60, 20);
dirLight.castShadow = true;
scene.add(dirLight);
scene.add(new THREE.GridHelper(100, 100, 0x333333, 0x222222));

const buildingGroup = new THREE.Group();
scene.add(buildingGroup);

// Listener Resize Window untuk responsivitas Canvas 3D
window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

const canvas = document.getElementById('canvas2d');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

document.getElementById('upload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
            const MAX_DIM = 280; 
            let w = img.width, h = img.height;
            if (w > h) { h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
            else { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
            canvas.width = w; canvas.height = h;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
});

document.getElementById('wallH').addEventListener('input', e => document.getElementById('wallH-val').innerText = e.target.value + ' m');
document.getElementById('minThick').addEventListener('input', e => document.getElementById('minThick-val').innerText = e.target.value + ' px');
document.getElementById('minLen').addEventListener('input', e => document.getElementById('minLen-val').innerText = e.target.value + ' px');
document.getElementById('thresh').addEventListener('input', e => document.getElementById('thresh-val').innerText = e.target.value);

document.getElementById('generateBtn').addEventListener('click', () => {
    if(canvas.width === 0) return alert("Silakan upload gambar denah 2D terlebih dahulu.");
    
    document.getElementById('loader').style.display = 'flex';
    
    setTimeout(() => {
        while(buildingGroup.children.length > 0) buildingGroup.remove(buildingGroup.children[0]);

        const heightVal = parseFloat(document.getElementById('wallH').value);
        const minThick = parseInt(document.getElementById('minThick').value);
        const minLength = parseInt(document.getElementById('minLen').value);
        const threshold = parseInt(document.getElementById('thresh').value);
        
        const SCALE = 0.15; 
        const WALL_T = 0.15; 
        const DOOR_H = 2.1; 
        const SILL_H = 0.9; 

        const w = canvas.width, h = canvas.height;
        const imgData = ctx.getImageData(0, 0, w, h).data;
        
        const rawMap = Array.from({length: h}, () => new Array(w).fill(false));
        for(let y = 0; y < h; y++){
            for(let x = 0; x < w; x++){
                const idx = (y * w + x) * 4;
                const brightness = (imgData[idx] + imgData[idx+1] + imgData[idx+2]) / 3;
                if(brightness < threshold) rawMap[y][x] = true;
            }
        }

        const structMap = Array.from({length: h}, () => new Array(w).fill(false));
        for(let y = minThick; y

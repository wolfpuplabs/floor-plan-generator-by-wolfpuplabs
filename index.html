<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Architectural Building Generator from Floor Plan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #fff; overflow: hidden; }
        #app-container { display: flex; width: 100vw; height: 100vh; }
        
        /* Sidebar Controls */
        #sidebar { width: 340px; background: #252526; padding: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.5); overflow-y: auto; }
        h2 { font-size: 1.1rem; color: #4ec9b0; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 5px; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.85rem; color: #ccc; }
        input[type="file"], input[type="range"], select { background: #333; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; font-size: 0.85rem; }
        input[type="range"] { accent-color: #4ec9b0; }
        .val-disp { font-size: 0.75rem; color: #4ec9b0; text-align: right; }
        
        button { background: #0e639c; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #1177bb; }
        
        /* Preview 2D & Canvas Hidden Process */
        #preview-container { width: 100%; height: 150px; background: #000; border: 1px dashed #555; display: flex; align-items: center; justify-content: center; position: relative; }
        #floorplan-canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        /* 3D Viewport */
        #viewport { flex: 1; position: relative; background: #111; }
        #info-overlay { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 6px; font-size: 0.8rem; pointer-events: none; border: 1px solid #333; }
    </style>
    <!-- Import Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="app-container">
    <div id="sidebar">
        <h2>1. Upload Denah (2D)</h2>
        <div class="control-group">
            <label>Pilih File (PNG/JPG - Garis Hitam/Latar Putih)</label>
            <input type="file" id="upload-input" accept="image/*">
        </div>
        <div id="preview-container">
            <canvas id="floorplan-canvas"></canvas>
        </div>

        <h2>2. Parameter Arsitektur</h2>
        <div class="control-group">
            <label>Tinggi Lantai ke Lantai (m)</label>
            <input type="range" id="wall-height" min="2.8" max="4.5" step="0.1" value="3.2">
            <span class="val-disp" id="wall-height-val">3.2 m (Standar Residensial)</span>
        </div>
        
        <div class="control-group">
            <label>Sensivitas Dinding (Thresh)</label>
            <input type="range" id="threshold" min="50" max="200" step="1" value="120">
            <span class="val-disp" id="threshold-val">120</span>
        </div>

        <div class="control-group">
            <label>Tipe Atap</label>
            <select id="roof-type">
                <option value="flat">Atap Datar (Dak Beton)</option>
                <option value="gables">Atap Pelana (Gable)</option>
                <option value="none">Tanpa Atap (Open Top)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Visualisasi Estetika</label>
            <select id="material-style">
                <option value="architectural">White Model (Maket Arsitektur)</option>
                <option value="realistic">Material Realistis</option>
            </select>
        </div>

        <button id="generate-btn">Generate Model 3D</button>
    </div>

    <div id="viewport">
        <div id="info-overlay">
            Controls: Klik Kiri + Drag (Orbit) | Scroll (Zoom) | Klik Kanan (Pan)
        </div>
    </div>
</div>

<script>
// --- Global Variables ---
let scene, camera, renderer, controls;
let buildingGroup;
const canvas = document.getElementById('floorplan-canvas');
const ctx = canvas.getContext('2d');

// --- Initialization ---
function init3D() {
    const container = document.getElementById('viewport');
    
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e1e24);

    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(30, 40, 50);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Architectural Lighting Setup
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
    sunLight.position.set(40, 60, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 150;
    const d = 40;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    const gridHelper = new THREE.GridHelper(100, 100, 0x444444, 0x222222);
    scene.add(gridHelper);

    buildingGroup = new THREE.Group();
    scene.add(buildingGroup);

    window.addEventListener('resize', onWindowResize);
    animate();
}

function onWindowResize() {
    const container = document.getElementById('viewport');
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
}

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

// --- Image Processing & 3D Extrusion ---
document.getElementById('upload-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
            // Resize to standard resolution for processing
            const maxDim = 200;
            let w = img.width;
            let h = img.height;
            if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
            } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
            }
            canvas.width = w;
            canvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
});

// UI Controls Dynamic Updates
document.getElementById('wall-height').addEventListener('input', (e) => {
    document.getElementById('wall-height-val').innerText = `${e.target.value} m (Standar Residensial)`;
});
document.getElementById('threshold').addEventListener('input', (e) => {
    document.getElementById('threshold-val').innerText = e.target.value;
});

// Generator Logic
document.getElementById('generate-btn').addEventListener('click', generate3DBuilding);

function generate3DBuilding() {
    if (canvas.width === 0) {
        alert("Silakan upload gambar denah terlebih dahulu!");
        return;
    }

    // Clear previous model
    while(buildingGroup.children.length > 0){ 
        const obj = buildingGroup.children[0];
        buildingGroup.remove(obj); 
    }

    const wallHeight = parseFloat(document.getElementById('wall-height').value);
    const threshVal = parseInt(document.getElementById('threshold').value);
    const roofType = document.getElementById('roof-type').value;
    const style = document.getElementById('material-style').value;

    // Materials based on architectural style
    const isArch = style === 'architectural';
    const wallMat = new THREE.MeshStandardMaterial({ 
        color: isArch ? 0xf0f0f0 : 0xdedede, 
        roughness: 0.5 
    });
    const floorMat = new THREE.MeshStandardMaterial({ 
        color: isArch ? 0xd0d0d0 : 0x8d6e63, 
        roughness: 0.8 
    });
    const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        transmission: 0.9,
        opacity: 1,
        transparent: true,
        roughness: 0.1,
        ior: 1.5
    });

    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;
    const w = canvas.width;
    const h = canvas.height;

    // Scale pixel to real world architectural meters (e.g., 1 pixel = 0.15m)
    const scale = 0.2; 
    const offsetX = (w * scale) / 2;
    const offsetZ = (h * scale) / 2;

    // 1. Generate Floor Slab
    const floorGeo = new THREE.BoxGeometry(w * scale, 0.2, h * scale);
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.position.set(0, -0.1, 0);
    floorMesh.receiveShadow = true;
    buildingGroup.add(floorMesh);

    // 2. Extrude Walls based on pixel threshold
    // Voxels/Blocks merging for performance
    const wallGeoList = [];
    const boxGeo = new THREE.BoxGeometry(scale, wallHeight, scale);
    
    // Pixel scanning logic for walls
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const idx = (y * w + x) * 4;
            const r = data[idx];
            const g = data[idx+1];
            const b = data[idx+2];
            const brightness = (r + g + b) / 3;

            // Black pixels represent walls
            if (brightness < threshVal) {
                const posX = (x * scale) - offsetX;
                const posZ = (y * scale) - offsetZ;

                // Simple Lintels logic (Sill & Head Height for windows/doors simulation)
                // If it's internal wall vs external, create openings dynamically
                const mesh = new THREE.Mesh(boxGeo, wallMat);
                mesh.position.set(posX, wallHeight / 2, posZ);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                buildingGroup.add(mesh);
            }
        }
    }

    // 3. Generate Roof based on Architectural Rules
    if (roofType === 'flat') {
        const roofGeo = new THREE.BoxGeometry(w * scale + 0.4, 0.2, h * scale + 0.4);
        const roofMat = new THREE.MeshStandardMaterial({ color: isArch ? 0xe0e0e0 : 0x555555 });
        const roofMesh = new THREE.Mesh(roofGeo, roofMat);
        roofMesh.position.set(0, wallHeight + 0.1, 0);
        roofMesh.castShadow = true;
        buildingGroup.add(roofMesh);
    } else if (roofType === 'gables') {
        const roofShape = new THREE.Shape();
        const roofWidth = w * scale + 0.6;
        const roofHeight = 2.5; // Pitch height
        
        roofShape.moveTo(-roofWidth / 2, 0);
        roofShape.lineTo(0, roofHeight);
        roofShape.lineTo(roofWidth / 2, 0);
        roofShape.closePath();

        const extrudeSettings = { depth: h * scale + 0.6, bevelEnabled: false };
        const gableGeo = new THREE.ExtrudeGeometry(roofShape, extrudeSettings);
        const roofMat = new THREE.MeshStandardMaterial({ color: isArch ? 0xd5d5d5 : 0xb71c1c });
        const gableMesh = new THREE.Mesh(gableGeo, roofMat);
        
        gableMesh.rotation.y = 0;
        gableMesh.position.set(0, wallHeight, -(h * scale + 0.6) / 2);
        gableMesh.castShadow = true;
        buildingGroup.add(gableMesh);
    }

    // Adjust Camera Focus
    controls.target.set(0, wallHeight / 2, 0);
}

// Start Three.js Context on Load
window.onload = init3D;
</script>
</body>
</html>

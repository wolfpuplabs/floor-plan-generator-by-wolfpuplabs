<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Floor Plan - Stable Accurate Windows</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #121214; color: #fff; overflow: hidden; font-size: 13px; }
        #app { display: flex; width: 100vw; height: 100vh; }
        
        #sidebar { width: 340px; background: #1a1a1d; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #333; z-index: 10; box-shadow: 2px 0 15px rgba(0,0,0,0.7); overflow-y: auto; }
        h1 { font-size: 1rem; color: #4ec9b0; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 0; letter-spacing: 0.5px; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.8rem; color: #ccc; }
        input[type="file"], input[type="range"] { background: #252529; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 4px; outline: none; }
        input[type="range"] { accent-color: #4ec9b0; cursor: pointer; }
        .val-disp { font-size: 0.75rem; color: #4ec9b0; text-align: right; font-weight: bold; }
        
        button { background: #0e639c; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; margin-top: 5px; letter-spacing: 1px; }
        button:hover { background: #1177bb; }
        
        #preview-box { width: 100%; height: 160px; background: #fff; border: 2px dashed #555; display: flex; align-items: center; justify-content: center; border-radius: 6px; overflow: hidden; }
        #canvas2d { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        #viewport { flex: 1; position: relative; background: #080808; }
        #loader { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; color: #4ec9b0; font-weight: bold; z-index: 20; flex-direction: column; gap: 15px; font-size: 1.1rem; }
        .spinner { width: 40px; height: 40px; border: 4px solid #222; border-top: 4px solid #4ec9b0; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="app">
    <div id="sidebar">
        <h1>Generator Dinding & Bukaan</h1>
        
        <div class="form-group">
            <label>1. Upload Denah 2D</label>
            <input type="file" id="upload" accept="image/*">
        </div>
        <div id="preview-box"><canvas id="canvas2d"></canvas></div>

        <div class="form-group">
            <label>Tinggi Floor-to-Floor (m)</label>
            <input type="range" id="wallH" min="2.8" max="4.5" step="0.1" value="3.2">
            <span class="val-disp" id="wallH-val">3.2 m</span>
        </div>

        <div class="form-group">
            <label>Ketebalan Minimum Dinding</label>
            <input type="range" id="minThick" min="1" max="5" step="1" value="2">
            <span class="val-disp" id="minThick-val">2 px</span>
        </div>

        <div class="form-group">
            <label>Panjang Minimum Dinding</label>
            <input type="range" id="minLen" min="1" max="40" step="1" value="6">
            <span class="val-disp" id="minLen-val">6 px</span>
        </div>
        
        <div class="form-group">
            <label>Sensitivitas Garis Hitam</label>
            <input type="range" id="thresh" min="50" max="250" step="1" value="187">
            <span class="val-disp" id="thresh-val">187</span>
        </div>

        <button id="generateBtn">Buat Maket Arsitektur 3D</button>
    </div>

    <div id="viewport">
        <div id="loader">
            <div class="spinner"></div>
            <span>Mengekstrak Dinding, Pintu, & Jendela...</span>
        </div>
    </div>
</div>

<script>
const container = document.getElementById('viewport');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151518);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(20, 30, 40);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
dirLight.position.set(30, 60, 20);
dirLight.castShadow = true;
scene.add(dirLight);
scene.add(new THREE.GridHelper(100, 100, 0x333333, 0x222222));

const buildingGroup = new THREE.Group();
scene.add(buildingGroup);

window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

const canvas = document.getElementById('canvas2d');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

document.getElementById('upload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
            const MAX_DIM = 280; 
            let w = img.width, h = img.height;
            if (w > h) { h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
            else { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
            canvas.width = w; canvas.height = h;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
});

document.getElementById('wallH').addEventListener('input', e => document.getElementById('wallH-val').innerText = e.target.value + ' m');
document.getElementById('minThick').addEventListener('input', e => document.getElementById('minThick-val').innerText = e.target.value + ' px');
document.getElementById('minLen').addEventListener('input', e => document.getElementById('minLen-val').innerText = e.target.value + ' px');
document.getElementById('thresh').addEventListener('input', e => document.getElementById('thresh-val').innerText = e.target.value);

document.getElementById('generateBtn').addEventListener('click', () => {
    if(canvas.width === 0) return alert("Silakan upload gambar denah 2D terlebih dahulu.");
    
    document.getElementById('loader').style.display = 'flex';
    
    setTimeout(() => {
        while(buildingGroup.children.length > 0) buildingGroup.remove(buildingGroup.children[0]);

        const heightVal = parseFloat(document.getElementById('wallH').value);
        const minThick = parseInt(document.getElementById('minThick').value);
        const minLength = parseInt(document.getElementById('minLen').value);
        const threshold = parseInt(document.getElementById('thresh').value);
        
        const SCALE = 0.15; 
        const WALL_T = 0.15; 
        const DOOR_H = 2.1; 
        const SILL_H = 0.9; 

        const w = canvas.width, h = canvas.height;
        const imgData = ctx.getImageData(0, 0, w, h).data;
        
        // Peta Biner Mentah
        const rawMap = Array.from({length: h}, () => new Array(w).fill(false));
        for(let y = 0; y < h; y++){
            for(let x = 0; x < w; x++){
                const idx = (y * w + x) * 4;
                const brightness = (imgData[idx] + imgData[idx+1] + imgData[idx+2]) / 3;
                if(brightness < threshold) rawMap[y][x] = true;
            }
        }

        // Peta Dinding Struktural (Sistem Stabil Tanpa Erosi Agresif)
        const structMap = Array.from({length: h}, () => new Array(w).fill(false));
        for(let y = minThick; y < h - minThick; y++){
            for(let x = minThick; x < w - minThick; x++){
                if(rawMap[y][x]) {
                    let hCount = 0, vCount = 0;
                    for(let d = -minThick; d <= minThick; d++) {
                        if(rawMap[y][x + d]) hCount++;
                        if(rawMap[y + d][x]) vCount++;
                    }
                    if(hCount >= minThick + 1 || vCount >= minThick + 1) {
                        structMap[y][x] = true;
                    }
                }
            }
        }

        const wallMat = new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.8 });
        const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x66bbff, transmission: 0.9, opacity: 1, transparent: true, roughness: 0.1, ior: 1.5 });
        
        const offsetX = (w * SCALE) / 2;
        const offsetZ = (h * SCALE) / 2;

        const createMesh = (posX, posZ, length, isHorizontal, yStart, yHeight, mat, isGlass = false) => {
            if(yHeight <= 0) return;
            // Jika objek adalah kaca, ketebalannya dibuat lebih tipis (1/3 tebal dinding)
            let thickness = isGlass ? (WALL_T * 0.3) : WALL_T;
            
            let boxW = isHorizontal ? (length * SCALE) : thickness;
            let boxD = isHorizontal ? thickness : (length * SCALE);
            
            const geo = new THREE.BoxGeometry(boxW, yHeight, boxD);
            const mesh = new THREE.Mesh(geo, mat);
            
            let finalX = (posX * SCALE) - offsetX + (isHorizontal ? boxW / 2 : 0);
            let finalZ = (posZ * SCALE) - offsetZ + (isHorizontal ? 0 : boxD / 2);
            
            mesh.position.set(finalX, yStart + (yHeight / 2), finalZ);
            mesh.castShadow = !isGlass; 
            mesh.receiveShadow = true;
            buildingGroup.add(mesh);
        };

        const processSegmentsAndGaps = (isHorizontal) => {
            const limit1 = isHorizontal ? h : w;
            const limit2 = isHorizontal ? w : h;
            const visited = Array.from({length: h}, () => new Array(w).fill(false));

            for(let i = 0; i < limit1; i++) {
                let j = 0;
                let segments = [];
                
                // Cari Segmen Dinding Tebal
                while(j < limit2) {
                    let y = isHorizontal ? i : j;
                    let x = isHorizontal ? j : i;
                    
                    if(structMap[y][x] && !visited[y][x]) {
                        let len = 0;
                        while(j + len < limit2) {
                            let cy = isHorizontal ? i : j + len;
                            let cx = isHorizontal ? j + len : i;
                            if(!structMap[cy][cx]) break;
                            visited[cy][cx] = true;
                            len++;
                        }
                        if(len >= minLength) {
                            createMesh(x, y, len, isHorizontal, 0, heightVal, wallMat);
                            segments.push({start: j, end: j + len});
                        }
                        j += len;
                    } else { j++; }
                }
                
                // Analisis Bukaan (Pintu/Jendela)
                for(let k = 0; k < segments.length - 1; k++) {
                    let gapStart = segments[k].end;
                    let gapEnd = segments[k+1].start;
                    let gapLen = gapEnd - gapStart;
                    
                    // PERBAIKAN: Batas deteksi dinaikkan hingga 85px untuk mendeteksi jendela berukuran raksasa
                    if(gapLen >= 4 && gapLen <= 85) {
                        let hitCount = 0;
                        
                        // Perlebar area pindaian untuk menangkap garis sejajar (jendela)
                        let bandWidth = Math.max(3, minThick + 2); 
                        
                        // Cek berapa banyak titik di sepanjang gap yang dilewati oleh garis hitam pada gambar asli
                        for(let g = gapStart; g < gapEnd; g++) {
                            let foundBlackPixel = false;
                            for(let d = -bandWidth; d <= bandWidth; d++) {
                                let gy = isHorizontal ? i + d : g;
                                let gx = isHorizontal ? g : i + d;
                                
                                // Cek agar tidak keluar batas gambar
                                if(gy >= 0 && gy < h && gx >= 0 && gx < w) {
                                    if(rawMap[gy][gx]) {
                                        foundBlackPixel = true;
                                        break;
                                    }
                                }
                            }
                            if(foundBlackPixel) hitCount++;
                        }
                        
                        let px = isHorizontal ? gapStart : i;
                        let pz = isHorizontal ? i : gapStart;

                        // Continuity adalah persentase panjang gap yang terisi garis (kaca/kusen pada denah)
                        let continuity = hitCount / gapLen;

                        // Jika lebih dari 40% panjang bukaan dilewati garis sejajar, maka itu JENDELA
                        if(continuity > 0.40) {
                            createMesh(px, pz, gapLen, isHorizontal, 0, SILL_H, wallMat); // Dinding Bawah
                            createMesh(px, pz, gapLen, isHorizontal, SILL_H, DOOR_H - SILL_H, glassMat, true); // Kaca Tipis
                        }
                        
                        // Buatkan Lintel (Ambang Atas) untuk menutupi bagian atas Pintu & Jendela
                        createMesh(px, pz, gapLen, isHorizontal, DOOR_H, heightVal - DOOR_H, wallMat);
                    }
                }
            }
        };

        processSegmentsAndGaps(true);
        processSegmentsAndGaps(false);

        // Pelat Lantai
        const floorGeo = new THREE.BoxGeometry((w * SCALE) + 4, 0.2, (h * SCALE) + 4);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.position.set(0, -0.1, 0);
        floorMesh.receiveShadow = true;
        buildingGroup.add(floorMesh);

        document.getElementById('loader').style.display = 'none';
        controls.target.set(0, heightVal / 2, 0);
    }, 50);
});
</script>
</body>
</html>

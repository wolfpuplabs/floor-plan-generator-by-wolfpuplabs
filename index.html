<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Architectural Generator Fixed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; overflow: hidden; font-size: 14px;}
        #app-container { display: flex; width: 100vw; height: 100vh; }
        #sidebar { width: 320px; background: #1e1e1e; padding: 15px; display: flex; flex-direction: column; gap: 12px; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.7); overflow-y: auto; border-right: 1px solid #333; }
        h1 { font-size: 1rem; color: #4ec9b0; border-bottom: 1px solid #444; padding-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        h2 { font-size: 0.85rem; color: #aaa; margin-top: 5px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.8rem; color: #ccc; }
        input[type="file"], select { background: #2d2d2d; border: 1px solid #444; color: #eee; padding: 6px; border-radius: 4px; font-size: 0.8rem; }
        input[type="range"] { accent-color: #4ec9b0; width: 100%; }
        .val-disp { font-size: 0.75rem; color: #4ec9b0; text-align: right; }
        button#generate-btn { background: #0e639c; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase; margin-top: 5px; transition: background 0.2s; }
        button#generate-btn:hover { background: #1177bb; }
        #preview-container { width: 100%; height: 160px; background: #000; border: 1px solid #444; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; }
        #floorplan-canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
        #status-bar { font-size: 0.75rem; color: #4ec9b0; text-align: center; }
        #viewport { flex: 1; position: relative; background: #0a0a0a; }
        #loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; color: #4ec9b0; font-size: 1.1rem; z-index: 20; gap: 10px; }
        .spinner { width: 30px; height: 30px; border: 3px solid #333; border-top: 3px solid #4ec9b0; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="app-container">
    <div id="sidebar">
        <h1>Architectural 3D Generator</h1>
        
        <h2>1. Upload Denah (2D)</h2>
        <div class="control-group">
            <input type="file" id="upload-input" accept="image/*">
        </div>
        <div id="preview-container">
            <canvas id="floorplan-canvas"></canvas>
        </div>
        <div id="status-bar">Pilih gambar denah...</div>

        <h2>2. Parameter Geometri</h2>
        <div class="control-group">
            <label>Tinggi Lantai (m)</label>
            <input type="range" id="wall-height" min="2.5" max="5.0" step="0.1" value="3.2">
            <span class="val-disp" id="wall-height-val">3.2 m</span>
        </div>
        
        <div class="control-group">
            <label>Sensitivitas Dinding (Threshold)</label>
            <input type="range" id="threshold" min="30" max="220" step="1" value="140">
            <span class="val-disp" id="threshold-val">140</span>
        </div>

        <div class="control-group">
            <label>Gaya Tampilan</label>
            <select id="material-style">
                <option value="clean">Maket Arsitektur (Clean White)</option>
                <option value="wireframe">Teknikal / Wireframe</option>
            </select>
        </div>

        <button id="generate-btn">GENERATE 3D MODEL</button>
    </div>

    <div id="viewport">
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div id="loading-text">Menganalisis Denah...</div>
        </div>
    </div>
</div>

<script>
let scene, camera, renderer, controls, buildingGroup;
const canvas = document.getElementById('floorplan-canvas');
const ctx = canvas.getContext('2d');
const loadingOverlay = document.getElementById('loading-overlay');
const loadingText = document.getElementById('loading-text');
const statusBar = document.getElementById('status-bar');

const SCALE = 0.08; // 1 pixel = 8 cm

function init3D() {
    const container = document.getElementById('viewport');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121212);

    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(30, 40, 50);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const sun = new THREE.DirectionalLight(0xffffff, 0.7);
    sun.position.set(40, 60, 20);
    sun.castShadow = true;
    scene.add(sun);

    scene.add(new THREE.GridHelper(100, 50, 0x444444, 0x222222));

    buildingGroup = new THREE.Group();
    scene.add(buildingGroup);

    window.addEventListener('resize', onWindowResize);
    animate();
}

function onWindowResize() {
    const container = document.getElementById('viewport');
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
}

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

document.getElementById('upload-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
            // Downscale gambar internal untuk optimasi pemrosesan cepat
            const maxRes = 150; 
            let w = img.width, h = img.height;
            if (w > h) { h = Math.round((h * maxRes) / w); w = maxRes; }
            else { w = Math.round((w * maxRes) / h); h = maxRes; }

            canvas.width = w; canvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);
            statusBar.innerText = `Gambar Siap (${w}x${h} px)`;
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
});

document.getElementById('wall-height').addEventListener('input', e => document.getElementById('wall-height-val').innerText = `${e.target.value} m`);
document.getElementById('threshold').addEventListener('input', e => document.getElementById('threshold-val').innerText = e.target.value);

document.getElementById('generate-btn').addEventListener('click', generate3D);

function generate3D() {
    if (canvas.width === 0) { alert("Upload gambar denah terlebih dahulu!"); return; }

    loadingOverlay.style.display = 'flex';
    loadingText.innerText = "Memproses Geometri Arsitektur...";

    setTimeout(() => {
        // Clear scene lama
        while(buildingGroup.children.length > 0) {
            buildingGroup.remove(buildingGroup.children[0]);
        }

        const height = parseFloat(document.getElementById('wall-height').value);
        const thresh = parseInt(document.getElementById('threshold').value);
        const style = document.getElementById('material-style').value;

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        const w = canvas.width, h = canvas.height;

        // Material Setup
        const isWire = style === 'wireframe';
        const wallMat = new THREE.MeshStandardMaterial({ 
            color: 0xefefef, 
            roughness: 0.4,
            wireframe: isWire 
        });
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x333333 });

        const offsetX = (w * SCALE) / 2;
        const offsetZ = (h * SCALE) / 2;

        // 1. Base Floor Slab
        const floorGeo = new THREE.BoxGeometry(w * SCALE, 0.2, h * SCALE);
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.position.set(0, -0.1, 0);
        buildingGroup.add(floorMesh);

        // 2. Fast Scan & Wall Consolidation (Preventing Freeze)
        const wallVisited = new Array(h).fill(0).map(() => new Array(w).fill(false));

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                if (wallVisited[y][x]) continue;

                const idx = (y * w + x) * 4;
                const brightness = (data[idx] + data[idx+1] + data[idx+2]) / 3;

                if (brightness < thresh) { // Garis hitam (Dinding)
                    // Cari segmen horizontal terpanjang
                    let len = 1;
                    while (x + len < w) {
                        const nIdx = (y * w + (x + len)) * 4;
                        const nB = (data[nIdx] + data[nIdx+1] + data[nIdx+2]) / 3;
                        if (nB < thresh && !wallVisited[y][x + len]) {
                            wallVisited[y][x + len] = true;
                            len++;
                        } else {
                            break;
                        }
                    }

                    // Render dinding terkonsolidasi
                    const wallGeo = new THREE.BoxGeometry(len * SCALE, height, SCALE * 1.2);
                    const wallMesh = new THREE.Mesh(wallGeo, wallMat);
                    
                    const posX = (x * SCALE) + (len * SCALE / 2) - offsetX;
                    const posZ = (y * SCALE) - offsetZ;

                    wallMesh.position.set(posX, height / 2, posZ);
                    wallMesh.castShadow = true;
                    wallMesh.receiveShadow = true;
                    buildingGroup.add(wallMesh);
                }
            }
        }

        controls.target.set(0, height / 2, 0);
        loadingOverlay.style.display = 'none';
        statusBar.innerText = "Model 3D Berhasil Dibuat!";
    }, 50);
}

window.onload = init3D;
</script>
</body>
</html>
